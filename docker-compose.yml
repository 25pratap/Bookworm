services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookworm-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # This value is embedded into the Vite bundle at build time.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: bookworm-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
